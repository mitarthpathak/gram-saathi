              - paragraph [ref=e317]: आयुष्मान भारत पीएम-जय में हर परिवार को हर साल ₹5 लाख तक का मुफ़्त इलाज सरकारी और सूचीबद्ध निजी अस्पतालों में मिलता है। इलाज कैशलेस है, अस्पताल में कोई पैसा नहीं देना होता। पात्रता SECC 2011 के आंकड़ों से तय होती है, और 70 साल या उससे ज़्यादा उम्र के सभी बुज़ुर्ग शामिल हैं। beneficiary.nha.gov.in पर अपना नाम देखें या 14555 पर कॉल करें, फिर CSC या अस्पताल से मुफ़्त आयुष्मान कार्ड बनवाएं।

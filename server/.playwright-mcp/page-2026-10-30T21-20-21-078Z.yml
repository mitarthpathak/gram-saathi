                      - generic [ref=e212]:
                        - generic [aria-hidden] [ref=e213]: "1"
                        - generic [ref=e214]:
                          - text: PM-KISAN Samman Nidhi
                          - generic [ref=e215]: · Benefits
                      - blockquote [ref=e216]: “Eligible landholding farmer families get ₹6,000 per year, paid in three equal instalments of ₹2,000 directly into their Aadhaar-seeded bank account (DBT).”
                      - button "Show more" [ref=e217]
                  - listitem [ref=e220]:
                    - generic [ref=e221]:
                      - generic [ref=e222]:
                        - generic [aria-hidden] [ref=e223]: "2"
                        - generic [ref=e224]:
                          - text: PM-KISAN Samman Nidhi
                          - generic [ref=e225]: · Eligibility
                      - blockquote [ref=e226]: "“All landholding farmer families whose names are in the land records are eligible. Excluded: institutional landholders, families with an income-tax payer, serving or retired government employees (except Group D / MTS), registered professionals such as doctors, engineers and lawyers, and pensioners getting ₹10,000 or more per month.”"
                      - button "Show more" [ref=e227]
                  - listitem [ref=e230]:
                    - generic [ref=e231]:
                      - generic [ref=e232]:
                        - generic [aria-hidden] [ref=e233]: "3"
                        - generic [ref=e234]:
                          - text: PM-KISAN Samman Nidhi
                          - generic [ref=e235]: · How to apply
                      - blockquote [ref=e236]: “Registration is free. Apply at pmkisan.gov.in (New Farmer Registration), at a Common Service Centre (CSC) or through the local Patwari / revenue officer. eKYC with Aadhaar is mandatory to receive instalments.”
                      - button "Show more" [ref=e237]
              - note [ref=e240]:
                - paragraph [ref=e243]: "धोखाधड़ी से सावधान: सरकारी योजनाओं में आवेदन मुफ़्त है। अपना OTP या बैंक PIN किसी को न बताएं। केवल .gov.in वेबसाइट या नज़दीकी CSC केंद्र का ही उपयोग करें।"
        - listitem [ref=e277]:

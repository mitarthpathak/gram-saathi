            - text: पीएम किसान योजना में साल में कितना पैसा मिलता है?
        - listitem [ref=e181]:
          - article [ref=e182]:
            - generic [ref=e188]:
              - generic [ref=e189]: PM-KISAN Samman Nidhi
              - generic [ref=e191]:
                - paragraph [ref=e192]: "Your dialect: Wagdi (वागड़ी)"
                - link "Wrong?" [ref=e193] [cursor=pointer]:
                  - /url: /dialects
              - paragraph [ref=e194]: पीएम-किसान योजना में पात्र किसान परिवारों को हर साल ₹6,000 मिलते हैं, जो ₹2,000 की तीन किस्तों में सीधे बैंक खाते में आते हैं। ज़मीन के रिकॉर्ड में आपका नाम होना चाहिए और आधार से eKYC ज़रूरी है। जिन परिवारों में कोई आयकर देता है या सरकारी कर्मचारी है, वे आवेदन नहीं कर सकते। पंजीकरण pmkisan.gov.in पर या नज़दीकी CSC केंद्र पर मुफ़्त है।
              - generic [ref=e195]:
                - button "Listen" [ref=e196]
                - link "View as SMS · 2" [ref=e201] [cursor=pointer]:
                  - /url: /sms
              - generic [ref=e204]:
